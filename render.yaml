# Render reads this when you create a Blueprint. Settings that aren't secrets are in the Dockerfile.
services:
  - type: web
    name: reposcout
    runtime: docker
    plan: free
    branch: master
    healthCheckPath: /api/health
    envVars:
      # sync: false means Render asks you for the value, and it never goes in this file.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: INDEX_PASSWORD
        sync: false
      # Sign in with GitHub. See docs/DEPLOY.md. Without all four, the app runs guest-only.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
