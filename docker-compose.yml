services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: repoguide
      POSTGRES_PASSWORD: repoguide
      POSTGRES_DB: repoguide
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here only run when the pgdata volume is first created.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoguide -d repoguide"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
